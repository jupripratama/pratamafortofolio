<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Cyber Cyan Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24"/>
  
  <!-- Subtle Ambient Glow in center -->
  <circle cx="256" cy="256" r="220" fill="url(#centerGlow)"/>

  <!-- Logo Typography JEP. -->
  <text 
    x="250" 
    y="282" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
    font-weight="900" 
    font-size="192" 
    letter-spacing="-6" 
    fill="#ffffff"
  >JEP<tspan fill="#22d3ee">.</tspan></text>
</svg>
